# ASSOCIAL — aplicação. O SQL Server é EXTERNO: configure DB_* no arquivo .env
# (copie .env.example para .env). Para testar com um SQL Server local, veja docker-compose.dev.yml.
#
#   docker compose up -d --build
#   docker compose exec app npm run db:migrate     # cria banco/tabelas/seed (1ª vez e a cada atualização)
services:
  app:
    build: .
    image: associal:latest
    container_name: associal
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      UPLOAD_DIR: /app/uploads
    ports:
      # Na VPS: BIND_ADDR=127.0.0.1 e PORT=3020 no .env — só o Nginx fala com a internet.
      - "${BIND_ADDR:-0.0.0.0}:${PORT:-3000}:3000"
    # Log do container com teto (3 arquivos de 10 MB): sem isso o json-file cresce sem limite no disco.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - uploads:/app/uploads
    extra_hosts:
      # permite usar DB_SERVER=host.docker.internal para um SQL Server instalado na própria máquina
      - "host.docker.internal:host-gateway"

volumes:
  uploads:
