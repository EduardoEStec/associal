# Site do Nginx na VPS. Instalar:
#   cp /opt/associal/deploy/nginx-associal.conf /etc/nginx/sites-available/associal
#   ln -sf /etc/nginx/sites-available/associal /etc/nginx/sites-enabled/associal
#   nginx -t && systemctl reload nginx
# Certificado: o wildcard *.intecsbr.org que os outros sites já usam.

server {
    listen 80;
    listen [::]:80;
    server_name associal.intecsbr.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name associal.intecsbr.org;

    ssl_certificate     /etc/letsencrypt/live/intecsbr.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/intecsbr.org/privkey.pem;

    # Fotos das ações: até 10 por envio, cada uma até upload_max_mb (padrão 10 MB).
    # O padrão do Nginx (1 MB) recusaria o envio com 413 antes de chegar ao app.
    client_max_body_size 110m;

    access_log /var/log/nginx/associal.access.log;
    error_log  /var/log/nginx/associal.error.log;

    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
