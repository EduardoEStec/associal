  --grad-marca: linear-gradient(90deg, #ff7507 0%, #5c3eeb 55%, #1739ff 100%);
  --fonte: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --texto-xs: 1rem; --texto-sm: 1.0833rem; --texto-base: 1.1667rem; --texto-lg: 1.25rem; --texto-xl: 1.4167rem; --texto-2xl: 1.75rem;
  --esp-1: .25rem; --esp-2: .5rem; --esp-3: .75rem; --esp-4: 1rem; --esp-5: 1.5rem; --esp-6: 2rem;
  --raio: 1.375rem; --raio-medio: 1.125rem; --raio-pequeno: 1rem; --raio-pilula: 999px;
  --alvo: 3rem; --menu-lateral: 16.25rem; --menu-inferior: 4.5rem; --cabecalho: 4rem;
  --ease: cubic-bezier(.22, .8, .3, 1); --dur: 260ms;
}
html { font-size: 75%; -webkit-text-size-adjust: 100%; }
@media (max-width: 639px), (pointer: coarse) { :root { --alvo: 3.4rem; } }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; font-family: var(--fonte); font-size: var(--texto-base); line-height: 1.5; color: var(--cor-texto); background: var(--cor-fundo); -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { margin: 0; line-height: 1.2; font-weight: 800; }
p { margin: 0; }
a { color: var(--cor-texto-primaria); text-decoration: none; }
button { font: inherit; color: inherit; }
ul, ol { margin: 0; padding: 0; list-style: none; }
:focus-visible { outline: 3px solid var(--cor-foco); outline-offset: 2px; }
.icone { width: 1.5rem; height: 1.5rem; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.icone.p { width: 1.125rem; height: 1.125rem; }
.icone.m { width: 1.25rem; height: 1.25rem; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.suave { color: var(--cor-texto-suave); }
.num { font-variant-numeric: tabular-nums; }
.oculto { display: none !important; }
#app { min-height: 100vh; }

/* Botões */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--esp-2); min-height: var(--alvo); padding: 0 var(--esp-4);
  font-size: var(--texto-base); font-weight: 700; line-height: 1; white-space: nowrap; cursor: pointer; border: 2px solid transparent; border-radius: var(--raio-pilula);
  background: var(--cor-primaria); color: #fff; transition: background .15s, box-shadow .2s, transform .15s var(--ease), border-color .15s;
}
.btn:hover { background: var(--cor-primaria-escura); color: #fff; }
.btn:active { transform: translateY(1px) scale(.985); }
.btn-sec { background: #fff; color: var(--cor-texto); border-color: var(--cor-borda); }
.btn-sec:hover { background: var(--cor-fundo-suave); color: var(--cor-texto); border-color: #c9c9cf; }
.btn-fant { background: transparent; color: var(--cor-texto-primaria); }
.btn-fant:hover { background: var(--cor-primaria-clara); color: var(--cor-primaria-escura); }
.btn-peq { min-height: 2.5rem; padding: 0 var(--esp-3); font-size: var(--texto-sm); }
.btn[disabled] { opacity: .6; cursor: progress; }
.btn .gira { width: 1.1rem; height: 1.1rem; border: 2.5px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: gira .7s linear infinite; }
@keyframes gira { to { transform: rotate(360deg); } }

/* Selos (ícone + texto, nunca só cor) */
.selo { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px 2px 7px; font-size: var(--texto-xs); font-weight: 700; border-radius: var(--raio-pilula); white-space: nowrap; }
.selo .icone { width: .95rem; height: .95rem; stroke-width: 2.4; }
.selo.ok { color: var(--cor-sucesso); background: var(--cor-sucesso-clara); }
.selo.info { color: var(--cor-info); background: var(--cor-info-clara); }
.selo.aviso { color: var(--cor-aviso); background: var(--cor-aviso-clara); }
.selo.erro { color: var(--cor-perigo); background: var(--cor-perigo-clara); }
.selo.neutro { color: var(--cor-texto-suave); background: var(--cor-cinza-claro); }

/* Campos */
.campo { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.campo > label, .rot { font-size: var(--texto-sm); font-weight: 700; color: var(--cor-texto); }
.entrada, .area {
  width: 100%; min-height: var(--alvo); padding: 0 var(--esp-3); font: inherit; color: var(--cor-texto); background: #fff;
  border: 1.5px solid #c9c9cf; border-radius: var(--raio-pequeno); transition: border-color .15s, box-shadow .2s;
}
.area { padding: var(--esp-3); min-height: 7.5rem; resize: vertical; line-height: 1.45; }
.entrada:hover, .area:hover { border-color: #9b9ba3; }
.entrada:focus, .area:focus, .sel-btn:focus-visible, .dp-btn:focus-visible { outline: none; border-color: var(--cor-foco); box-shadow: 0 0 0 .25rem rgba(23,57,255,.16); }
.entrada::placeholder, .area::placeholder { color: #8a8a92; }
.contador { font-size: var(--texto-xs); color: var(--cor-texto-suave); text-align: right; }

/* Chips de escolha */
.chips { display: flex; flex-wrap: wrap; gap: var(--esp-2); }
.chip {
  display: inline-flex; align-items: center; gap: 6px; min-height: 2.5rem; padding: 0 var(--esp-3); font-size: var(--texto-sm); font-weight: 700; cursor: pointer;
  color: var(--cor-texto); background: #fff; border: 1.5px solid #c9c9cf; border-radius: var(--raio-pilula); transition: background .15s, border-color .15s, color .15s, transform .15s var(--ease), box-shadow .2s;
}
.chip:hover { border-color: var(--cor-primaria); background: #fffaf5; }
.chip:active { transform: scale(.97); }
.chip[aria-pressed="true"] { color: #fff; background: var(--cor-primaria); border-color: var(--cor-primaria); }
.chip .icone { width: 1.1rem; height: 1.1rem; }
.chip .qtd { font-weight: 600; opacity: .75; font-variant-numeric: tabular-nums; }

/* Dropdown (select bonito) */
.sel { position: relative; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.sel-btn {
  display: flex; align-items: center; justify-content: space-between; gap: var(--esp-2); width: 100%; min-height: var(--alvo); padding: 0 var(--esp-3); text-align: left; cursor: pointer;
  background: #fff; border: 1.5px solid #c9c9cf; border-radius: var(--raio-pequeno); transition: border-color .15s, box-shadow .2s;
}
.sel-btn:hover { border-color: #9b9ba3; }
.sel.aberto .sel-btn { border-color: var(--cor-foco); box-shadow: 0 0 0 .25rem rgba(23,57,255,.16); }
.sel-val { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sel-val.sem { color: #8a8a92; }
.sel-seta { transition: transform .25s var(--ease); color: var(--cor-texto-suave); }
.sel.aberto .sel-seta { transform: rotate(180deg); }
.sel-pop {
  position: absolute; z-index: 40; left: 0; right: 0; top: calc(100% + 6px); max-height: 18rem; overflow: auto; padding: var(--esp-1);
  background: #fff; border: 1px solid var(--cor-borda); border-radius: var(--raio-pequeno); box-shadow: 0 .75rem 2rem rgba(20,20,40,.16);
  opacity: 0; visibility: hidden; transform: translateY(-6px) scale(.97); transform-origin: top center; pointer-events: none;
  transition: opacity .16s ease, transform .22s var(--ease), visibility 0s .22s;
}
.sel.aberto .sel-pop { opacity: 1; visibility: visible; transform: none; pointer-events: auto; transition-delay: 0s; }
.sel-busca { position: relative; padding: var(--esp-1); }
.sel-busca input { width: 100%; min-height: 2.5rem; padding: 0 var(--esp-3) 0 2.2rem; font: inherit; border: 1.5px solid var(--cor-borda); border-radius: .75rem; background: var(--cor-fundo-suave); }
.sel-busca input:focus { outline: none; border-color: var(--cor-foco); background: #fff; }
.sel-busca .icone { position: absolute; left: 1.2rem; top: 50%; transform: translateY(-50%); color: var(--cor-texto-suave); }
.sel-op {
  display: flex; align-items: center; justify-content: space-between; gap: var(--esp-2); min-height: 2.75rem; padding: 0 var(--esp-3); cursor: pointer; border-radius: .75rem;
  transition: background .12s;
}
.sel-op small { display: block; color: var(--cor-texto-suave); font-size: var(--texto-xs); line-height: 1.2; }
.sel-op.ativo, .sel-op:hover { background: var(--cor-primaria-clara); }
.sel-op[aria-selected="true"] { font-weight: 700; color: var(--cor-texto-primaria); }
.sel-op .icone { width: 1.1rem; height: 1.1rem; opacity: 0; transform: scale(.5); transition: .2s var(--ease); color: var(--cor-primaria); }
.sel-op[aria-selected="true"] .icone { opacity: 1; transform: none; }
.sel.aberto .sel-op { animation: opEntra .28s var(--ease) both; animation-delay: calc(var(--n, 0) * 22ms); }
@keyframes opEntra { from { opacity: 0; transform: translateY(-4px); } }

/* Calendário */
.dp { position: relative; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.dp-btn {
  display: flex; align-items: center; gap: var(--esp-2); width: 100%; min-height: var(--alvo); padding: 0 var(--esp-3); text-align: left; cursor: pointer;
  background: #fff; border: 1.5px solid #c9c9cf; border-radius: var(--raio-pequeno); transition: border-color .15s, box-shadow .2s;
}
.dp-btn:hover { border-color: #9b9ba3; }
.dp.aberto .dp-btn { border-color: var(--cor-foco); box-shadow: 0 0 0 .25rem rgba(23,57,255,.16); }
.dp-btn .icone { color: var(--cor-texto-suave); }
.dp-pop {
  position: absolute; z-index: 40; top: calc(100% + 6px); left: 0; width: 22rem; max-width: calc(100vw - 2rem); padding: var(--esp-3);
  background: #fff; border: 1px solid var(--cor-borda); border-radius: var(--raio-medio); box-shadow: 0 .75rem 2rem rgba(20,20,40,.18);
  opacity: 0; visibility: hidden; transform: translateY(-6px) scale(.97); transform-origin: top left; pointer-events: none;
  transition: opacity .16s ease, transform .24s var(--ease), visibility 0s .24s;
}
.dp.aberto .dp-pop, .dp.fixo .dp-pop { opacity: 1; visibility: visible; transform: none; pointer-events: auto; transition-delay: 0s; }
.dp.fixo .dp-pop { position: static; box-shadow: 0 .5rem 1.5rem rgba(20,20,40,.1); }
.dp-topo { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--esp-2); }
.dp-topo strong { font-size: var(--texto-base); text-transform: capitalize; }
.dp-nav { display: grid; place-items: center; width: 2.25rem; height: 2.25rem; cursor: pointer; background: none; border: 0; border-radius: 50%; color: var(--cor-texto); transition: background .15s, transform .15s var(--ease); }
.dp-nav:hover { background: var(--cor-cinza-claro); }
.dp-nav:active { transform: scale(.9); }
.dp-grade { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; overflow: hidden; }
.dp-grade.vai { animation: dpVai .26s var(--ease); } .dp-grade.volta { animation: dpVolta .26s var(--ease); }
@keyframes dpVai { from { opacity: 0; transform: translateX(14px); } } @keyframes dpVolta { from { opacity: 0; transform: translateX(-14px); } }
.dp-sem { text-align: center; font-size: var(--texto-xs); font-weight: 700; color: var(--cor-texto-suave); padding: 4px 0; }
.dp-dia {
  position: relative; aspect-ratio: 1; display: grid; place-items: center; min-height: 2.25rem; font-size: var(--texto-sm); font-weight: 600; cursor: pointer;
  background: none; border: 0; border-radius: 50%; color: var(--cor-texto); transition: background .12s, color .12s, transform .15s var(--ease);
}
.dp-dia:hover { background: var(--cor-primaria-clara); transform: scale(1.08); }
.dp-dia.fora { color: #a8a8b0; }
.dp-dia.hoje { box-shadow: inset 0 0 0 2px var(--cor-marca); }
.dp-dia.ev::after { content: ''; position: absolute; bottom: 5px; width: 4px; height: 4px; border-radius: 50%; background: var(--cor-roxo); }
.dp-dia[aria-pressed="true"] { color: #fff; background: var(--cor-primaria); animation: pop .3s var(--ease); }
.dp-dia[aria-pressed="true"].ev::after { background: #fff; }
.dp-dia[disabled] { opacity: .35; cursor: not-allowed; pointer-events: none; }
@keyframes pop { 50% { transform: scale(1.18); } }
.dp-rodape { display: flex; justify-content: space-between; margin-top: var(--esp-2); padding-top: var(--esp-2); border-top: 1px solid var(--cor-borda); }

/* Modal / folha */
.modal-fundo { position: fixed; inset: 0; z-index: 200; display: grid; place-items: center; padding: var(--esp-4); background: rgba(20,20,35,.45); animation: fundoEntra .22s ease both; }
.modal-fundo.saindo { animation: fundoSai .18s ease both; }
@keyframes fundoEntra { from { opacity: 0; } } @keyframes fundoSai { to { opacity: 0; } }
.modal { width: min(100%, 34rem); max-height: calc(100vh - 3rem); overflow: auto; background: #fff; border-radius: var(--raio); box-shadow: 0 1.5rem 3.5rem rgba(20,20,40,.3); animation: modalEntra .34s var(--ease) both; }
.modal-fundo.saindo .modal { animation: modalSai .18s ease both; }
@keyframes modalEntra { from { opacity: 0; transform: translateY(18px) scale(.96); } } @keyframes modalSai { to { opacity: 0; transform: translateY(10px) scale(.98); } }
.modal-topo { display: flex; align-items: center; justify-content: space-between; gap: var(--esp-3); padding: var(--esp-4) var(--esp-4) var(--esp-2); }
.modal-topo h2 { font-size: var(--texto-xl); }
.modal-corpo { padding: var(--esp-2) var(--esp-4) var(--esp-4); display: flex; flex-direction: column; gap: var(--esp-3); }
.modal-acoes { display: flex; justify-content: flex-end; gap: var(--esp-2); padding: var(--esp-3) var(--esp-4); border-top: 1px solid var(--cor-borda); }
.fechar { display: grid; place-items: center; width: 2.5rem; height: 2.5rem; cursor: pointer; background: none; border: 0; border-radius: 50%; color: var(--cor-texto-suave); transition: background .15s, transform .2s var(--ease); }
.fechar:hover { background: var(--cor-cinza-claro); color: var(--cor-texto); transform: rotate(90deg); }
@media (max-width: 639px) {
  .modal-fundo { align-items: end; padding: 0; }
  .modal { width: 100%; border-radius: var(--raio) var(--raio) 0 0; max-height: 88vh; animation-name: folhaEntra; }
  .modal-fundo.saindo .modal { animation-name: folhaSai; }
  .modal::before { content: ''; display: block; width: 2.5rem; height: 4px; margin: .5rem auto 0; background: #d0d0d6; border-radius: 4px; }
}
@keyframes folhaEntra { from { transform: translateY(100%); } } @keyframes folhaSai { to { transform: translateY(100%); } }

/* Toast */
.toasts { position: fixed; z-index: 300; left: 50%; bottom: 1.5rem; transform: translateX(-50%); display: flex; flex-direction: column; gap: var(--esp-2); align-items: center; pointer-events: none; }
@media (max-width: 899px) { .toasts { bottom: calc(var(--menu-inferior) + 1rem); } }
.toast { display: flex; align-items: center; gap: var(--esp-2); padding: .65rem var(--esp-4); color: #fff; background: #26262b; border-radius: var(--raio-pilula); box-shadow: 0 .5rem 1.5rem rgba(0,0,0,.3); font-weight: 600; font-size: var(--texto-sm); animation: toastIn .35s var(--ease) both; }
.toast .icone { color: #5fd884; }
.toast.sai { animation: toastOut .25s ease both; }
@keyframes toastIn { from { opacity: 0; transform: translateY(14px) scale(.94); } } @keyframes toastOut { to { opacity: 0; transform: translateY(8px); } }

/* Skeleton */
.sk { display: block; border-radius: .6rem; background: linear-gradient(100deg, #eeeef0 30%, #f8f8f9 50%, #eeeef0 70%) 0 0 / 220% 100%; animation: shimmer 1.3s linear infinite; }
@keyframes shimmer { to { background-position: -120% 0; } }
.sk.t1 { height: 1.4rem; width: 55%; } .sk.t2 { height: 1rem; width: 80%; } .sk.t3 { height: 1rem; width: 40%; }
.sk.blk { height: 7rem; border-radius: var(--raio-medio); } .sk.circ { border-radius: 50%; }

/* Seletor de telas (só do mockup) */
.telas { position: relative; }
.telas-btn { display: inline-flex; align-items: center; gap: 6px; min-height: 2.25rem; padding: 0 var(--esp-3); font-size: var(--texto-xs); font-weight: 700; color: var(--cor-texto-suave); cursor: pointer; background: #fff; border: 1.5px dashed #b9b9c0; border-radius: var(--raio-pilula); transition: .15s; }
.telas-btn:hover { color: var(--cor-texto); border-color: var(--cor-marca); }
.telas .sel-pop { left: auto; right: 0; width: 15rem; top: calc(100% + 8px); }
.telas .sel-op { justify-content: flex-start; gap: var(--esp-2); }
.telas .sel-op .icone { opacity: 1; transform: none; color: var(--cor-texto-suave); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; animation-delay: 0s !important; transition-duration: .001ms !important; transition-delay: 0s !important; scroll-behavior: auto !important; }
  .sk { animation: none; background: #eeeef0; }
}
.telas .sel-btn { width: auto; min-height: 2.25rem; padding: 0 var(--esp-3); gap: 6px; font-size: var(--texto-xs); font-weight: 700; color: var(--cor-texto-suave); border: 1.5px dashed #b9b9c0; border-radius: var(--raio-pilula); }
.telas .sel-btn:hover { color: var(--cor-texto); border-color: var(--cor-marca); }
.telas .sel-op { justify-content: flex-start; gap: var(--esp-2); } .telas .sel-op .icone { opacity: 1; transform: none; color: var(--cor-texto-suave); }
.treme { animation: treme .4s; } @keyframes treme { 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }
.vazio { display: flex; flex-direction: column; align-items: center; gap: var(--esp-2); padding: var(--esp-6) var(--esp-4); text-align: center; color: var(--cor-texto-suave); }
.vazio .icone { width: 2.25rem; height: 2.25rem; } .vazio strong { color: var(--cor-texto); }
/* gráficos comuns */
.barras { display: flex; align-items: flex-end; gap: var(--esp-3); height: var(--alt); }
.barra { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; }
.barra i { display: block; width: 100%; max-width: 3.2rem; height: var(--h); min-height: 4px; background: #d9d9de; border-radius: .5rem .5rem .2rem .2rem; transform-origin: bottom; animation: cresce .7s var(--ease) both; animation-delay: calc(var(--i) * 70ms + 150ms); }
.barra.dest i { background: var(--cor-marca); }
.barra-v { font-size: var(--texto-xs); font-weight: 700; } .barra-l { font-size: var(--texto-xs); color: var(--cor-texto-suave); font-weight: 600; }
@keyframes cresce { from { transform: scaleY(0); } }
.hbarras { display: flex; flex-direction: column; gap: var(--esp-3); }
.hbarras li { display: grid; grid-template-columns: minmax(7rem, 11rem) 1fr 2.2rem; align-items: center; gap: var(--esp-3); font-size: var(--texto-sm); }
.hb-l { font-weight: 600; } .hb-v { font-weight: 800; text-align: right; }
.hb-t { height: .6rem; background: var(--cor-cinza-claro); border-radius: 9px; overflow: hidden; }
.hb-t i { display: block; height: 100%; width: var(--w); background: var(--cor-marca); border-radius: 9px; transform-origin: left; animation: cresceX .8s var(--ease) both; animation-delay: calc(var(--i) * 90ms + 150ms); }
@keyframes cresceX { from { transform: scaleX(0); } }
.spark { width: 100%; height: 1.75rem; } .spark polyline { fill: none; stroke: var(--cor-marca); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 0; animation: desenha 1s var(--ease) both; }
@keyframes desenha { from { stroke-dashoffset: 1; } }
.donut circle:nth-child(n+2) { animation: arco .9s var(--ease) both; animation-delay: calc(var(--i) * 120ms); } @keyframes arco { from { stroke-dasharray: 0 100; } }

@media (max-width: 899px) { .telas .tx { display: none; } .telas .sel-btn { padding: 0 .65rem; } .telas .sel-pop { position: fixed; top: 4.2rem; right: .75rem; } }
html, body { overflow-x: clip; }

.telas .sel-btn { white-space: nowrap; }

/* ===== C · Operação ===== */
:root { --raio-c: .8rem; --fio: 1px solid var(--cor-borda); --rail: 4.6rem; --cabecalho: 3.6rem; }
.casca { min-height: 100vh; }
.carga { position: fixed; z-index: 400; left: 0; top: 0; height: 3px; width: 100%; background: var(--grad-marca); transform: scaleX(0); transform-origin: left; opacity: 0; pointer-events: none; }
.carregando .carga { opacity: 1; animation: carga .6s var(--ease) infinite; } @keyframes carga { from { transform: scaleX(0); } 80% { transform: scaleX(1); opacity: 1; } to { transform: scaleX(1); opacity: 0; } }

    const isT = d.toDateString() === hoje.toDateString();

async function salvar(b) {
  const f = $('form[data-form]'); const falta = $$('[data-obrig]', f).find(o => !(o.matches('.sel,.dp') ? o.dataset.val : o.value?.trim()));
  if (falta) { falta.classList.add('treme'); setTimeout(() => falta.classList.remove('treme'), 500); falta.scrollIntoView({ block: 'center', behavior: RM ? 'auto' : 'smooth' }); toast('Preencha os campos obrigatórios'); return; }
  const html = b.innerHTML; b.disabled = true; b.innerHTML = '<span class="gira"></span> Salvando…'; await wait(RM ? 100 : 1100);
  b.innerHTML = ic('check', 'm') + ' Salvo'; toast('Atendimento registrado com sucesso'); await wait(RM ? 100 : 700); b.disabled = false; b.innerHTML = html; go('atend');
}
