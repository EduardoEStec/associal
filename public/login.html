<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ff7507">
  <title>Entrar — ASSOCIAL</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <main class="login-tela">
    <div class="card login-card">
      <div class="login-marca">
        <img src="/img/logo-associal.png" alt="" width="96" height="96">
        <h1>ASSOCIAL</h1>
        <p class="texto-suave texto-pequeno">Serviço Social · Armazéns Solidários</p>
      </div>
      <form id="form-login" novalidate>
        <div class="campo">
          <label for="login">Usuário</label>
          <input class="input" id="login" name="login" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
        </div>
        <div class="campo">
          <label for="senha">Senha</label>
          <input class="input" id="senha" name="senha" type="password" autocomplete="current-password" required>
        </div>
        <div id="erro-login" class="aviso aviso-perigo oculto" role="alert"></div>
        <button class="btn btn-bloco" type="submit" id="botao-entrar">Entrar</button>
      </form>
    </div>
  </main>
  <script type="module" src="/js/login.js"></script>
</body>
</html>
